# fly.toml — reference deployment for a Memory Bridge instance
# 1. Set `app` to a unique name: `fly launch --copy-config --no-deploy`
# 2. Set secrets: `fly secrets set AIK_API_KEYS=your_key`
# 3. Deploy: `fly deploy`
#
# Live reference deployment: https://aik-memory-bridge.fly.dev

app = "memory-bridge"
primary_region = "iad"

[build]
  image = "registry.fly.io/aik-memory-bridge:deployment-01KSWVYFFX9CNPKD7Y1Y00JYME"

[env]
  PORT = "8080"
  # Set PROJECT_ID per-instance via `fly secrets set`

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[checks]
  [checks.health]
    type = "http"
    port = 8080
    method = "POST"
    path = "/mcp"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"